# --- DeepSeek (peak prices; no write premium; cache_read_mult = hit price / miss price) ---
# `medium` and `xhigh` are DeepSeek aliases of `high`, so they are not listed.

[[model]]
id = "deepseek-flash"
provider = "deepseek"
price_in = 0.30
price_out = 1.20
context_window = 1048576
tier = 4
cache_write_mult = 1.0
cache_read_mult = 0.02
efforts = ["none", "low", "high", "max"]
effort_output_mult = { none = 1.0, low = 1.0, high = 1.0, max = 1.0 }
effort_map = { none = "none", low = "low", high = "high", max = "max" }
effort_change_keeps_cache = false
verified = true

[model.meta]

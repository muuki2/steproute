# steproute default model catalog.
#
# Format and field meanings: docs/CATALOG.md. Sources for every price, id and limit:
# docs/INTEGRATION-NOTES.md section 7 (checked 2026-11-13). Prices are USD per million tokens.
#
# ASSUMPTIONS, NOT MEASUREMENTS (edit freely):
#   * `tier` is a starting guess at cascade strength. It is not measured.
#   * `effort_output_mult` is 1.0 for every effort. Nobody has measured these; they are
#     placeholders to be replaced from the pilot replay (issue 18). `verified` does NOT cover them.
#
# `verified = true` covers price, cache multipliers, context window and effort levels.
# DeepSeek caveat: cache scope per model and the effect of toggling thinking are undetermined
# (see meta.open_cache_questions); `verified` does not claim they are known.
# Ollama context_window is the operational cap (decision D2), not the native limit
# (meta.native_context). Run Ollama with OLLAMA_CONTEXT_LENGTH=32768.
# DeepSeek price_in / price_out are PEAK prices (conservative for spend caps); off-peak is in meta.

# --- Anthropic (cache_write_mult is the 5-minute write; the 1-hour write is in meta) ---

[[model]]
id = "claude-haiku-5-5"
provider = "anthropic"
price_in = 0.10
price_out = 0.50
context_window = 1000000
tier = 4
cache_write_mult = 1.25
cache_read_mult = 0.1
efforts = ["low", "medium", "high", "xhigh", "max"]
effort_output_mult = { low = 1.0, medium = 1.0, high = 1.0, xhigh = 1.0, max = 1.0 }
effort_map = { low = "low", medium = "medium", high = "high", xhigh = "xhigh", max = "max" }
effort_change_keeps_cache = false
verified = true

# Prompts above 100,000 tokens (cache reads and writes included) pay these rates on the whole request.
[[model.price_tiers]]
above_tokens = 100000
price_in = 0.50
price_out = 2.50

[model.meta]
cache_write_1h_mult = 2.0
default_effort = "medium"
native_context = 1000000
source = "https://platform.claude.com/docs/en/about-claude/pricing"
checked = "2026-11-13"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "steproute"
version = "0.0.1"
description = "An open, outcome-trained, graph-based step router for LLM agents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
# litellm is pinned exactly and installed from uv.lock with hashes. NEVER use 1.82.7 or
# 1.82.8 (malicious credential-stealing .pth file) or 1.107.0 (wheels built from a lookalike
# repository); see docs/INTEGRATION-NOTES.md section 4. Upgrade only after re-reading the
# release and advisories, and re-run the checks in docs/PROXY.md.
proxy = ["litellm==1.109.1"]
mcp = ["mcp>=2.3,<3"]  # the server uses the 2.x MCPServer API
ml = ["lightgbm>=4.0", "scikit-learn>=1.3"]
graph = ["torch>=2.2", "torch-geometric>=2.5"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "hypothesis>=6", "jsonschema>=4"]

[project.scripts]
steproute = "steproute.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/steproute"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
files = [
    "src/steproute/core",
    "src/steproute/collectors",
    "src/steproute/tasks",
    "src/steproute/eval",
]
strict = true
